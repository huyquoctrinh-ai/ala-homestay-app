<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA Homestay - Quản Lý Tự Động</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function HomestayApp() {
      const [viewMode, setViewMode] = React.useState('admin'); // 'admin' | 'client'
      const [rooms, setRooms] = React.useState([
        { id: 'ala11', name: 'ALA 11 (101)', status: 'vacant', guest: '', phone: '', pin: '829102', wifi: 'ALA_11 / pass1234', revenue: 10151 },
        { id: 'ala12', name: 'ALA 12 (302)', status: 'occupied', guest: 'Nguyễn Văn A', phone: '0901234567', pin: '492018', wifi: 'ALA_12 / pass1234', revenue: 11839 },
        { id: 'ala13', name: 'ALA 13 (201)', status: 'vacant', guest: '', phone: '', pin: '519203', wifi: 'ALA_13 / pass1234', revenue: 8423 },
        { id: 'ala14', name: 'ALA 14 (202)', status: 'cleaning', guest: '', phone: '', pin: '730192', wifi: 'ALA_14 / pass1234', revenue: 11455 },
        { id: 'ala15', name: 'ALA 15 (301)', status: 'vacant', guest: '', phone: '', pin: '381920', wifi: 'ALA_15 / pass1234', revenue: 6405 },
      ]);
      const [selectedRoom, setSelectedRoom] = React.useState('ala11');
      const [clientName, setClientName] = React.useState('');
      const [clientPhone, setClientPhone] = React.useState('');
      const [successMsg, setSuccessMsg] = React.useState(false);

      const changeStatus = (id, newStatus) => {
        setRooms(rooms.map(r => r.id === id ? { ...r, status: newStatus, guest: newStatus === 'vacant' ? '' : r.guest } : r));
      };

      const handleBooking = (e) => {
        e.preventDefault();
        if(!clientName || !clientPhone) {
          alert('Vui lòng nhập tên và số điện thoại!');
          return;
        }
        setRooms(rooms.map(r => r.id === selectedRoom ? { ...r, status: 'occupied', guest: clientName, phone: clientPhone, revenue: r.revenue + 550000 } : r));
        setSuccessMsg(true);
      };

      const totalRevenue = rooms.reduce((acc, r) => acc + r.revenue, 0);

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 pb-12">
          {/* Header */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-slate-800 gap-4">
            <div>
              <h1 className="text-xl md:text-2xl font-bold text-blue-400">ALA Homestay - Gò Vấp</h1>
              <p className="text-xs text-slate-400">Hệ thống quản lý thông minh 5 phòng (ALA 11 - 15)</p>
            </div>
            <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
              <div className="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                <span className="text-[11px] text-slate-400 block">Tổng doanh thu:</span>
                <span className="text-sm font-bold text-emerald-400">{totalRevenue.toLocaleString()} VNĐ</span>
              </div>
              <button 
                onClick={() => setViewMode(viewMode === 'admin' ? 'client' : 'admin')}
                className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition"
              >
                {viewMode === 'admin' ? '👉 Cổng Đặt Phòng' : '👉 Trang Quản Trị'}
              </button>
            </div>
          </header>

          {viewMode === 'admin' ? (
            <div className="space-y-6">
              {/* Sơ đồ phòng linh hoạt: grid 1 cột trên ĐT, 5 cột trên PC */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                {rooms.map(room => (
                  <div key={room.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col justify-between shadow-lg">
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <span className="font-bold text-white">{room.name}</span>
                        <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                          room.status === 'occupied' ? 'bg-amber-500/20 text-amber-400' :
                          room.status === 'cleaning' ? 'bg-yellow-500/20 text-yellow-400' :
                          'bg-emerald-500/20 text-emerald-400'
                        }`}>
                          {room.status === 'occupied' ? 'Đang ở' : room.status === 'cleaning' ? 'Dọn dẹp' : 'Trống'}
                        </span>
                      </div>
                      <div className="space-y-1 text-xs text-slate-300 my-3">
                        <p><strong>Khách:</strong> {room.guest || 'Trống'}</p>
                        <p className="font-mono text-blue-400"><strong>PIN:</strong> {room.pin}</p>
                        <p className="text-slate-400 truncate"><strong>Wifi:</strong> {room.wifi}</p>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-slate-800">
                      <div className="flex justify-between text-xs text-slate-400 mb-2">
                        <span>Doanh thu:</span>
                        <span className="text-emerald-400 font-bold">{room.revenue.toLocaleString()} đ</span>
                      </div>
                      <div className="flex gap-1">
                        <button onClick={() => changeStatus(room.id, 'vacant')} className="flex-1 bg-slate-800 hover:bg-emerald-700 hover:text-white py-1 rounded text-[10px] transition">Trống</button>
                        <button onClick={() => changeStatus(room.id, 'cleaning')} className="flex-1 bg-slate-800 hover:bg-yellow-700 hover:text-white py-1 rounded text-[10px] transition">Dọn</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            /* Cổng khách đặt phòng */
            <div className="max-w-md mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
              <h2 className="text-lg font-bold text-center mb-4">Cổng Đặt Phòng Tự Động</h2>
              {successMsg ? (
                <div className="text-center space-y-3 py-6">
                  <div className="text-emerald-400 font-bold text-base">Thanh toán & Đặt phòng thành công!</div>
                  <p className="text-xs text-slate-300">Mã PIN cửa và thông tin phòng đã được gửi tự động qua Zalo ZNS cho bạn.</p>
                  <button onClick={() => setSuccessMsg(false)} className="bg-slate-800 text-white text-xs px-4 py-2 rounded-lg">Đặt phòng khác</button>
                </div>
              ) : (
                <form onSubmit={handleBooking} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Chọn phòng:</label>
                    <select value={selectedRoom} onChange={e => setSelectedRoom(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-slate-200">
                      {rooms.map(r => <option key={r.id} value={r.id}>{r.name} - 550.000đ/đêm</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Họ tên khách hàng:</label>
                    <input type="text" value={clientName} onChange={e => setClientName(e.target.value)} placeholder="Nhập họ tên" className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-slate-200" required />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Số điện thoại nhận mã PIN:</label>
                    <input type="tel" value={clientPhone} onChange={e => setClientPhone(e.target.value)} placeholder="Số điện thoại" className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-slate-200" required />
                  </div>
                  <div className="text-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <p className="text-slate-400 mb-2">Quét VietQR chuyển khoản (550.000đ):</p>
                    <img src={`https://img.vietqr.io/image/VCB-0123456789-compact2.png?amount=550000&addInfo=DATPHONG%20${selectedRoom.toUpperCase()}`} alt="QR" className="w-36 h-36 mx-auto bg-white p-1 rounded" />
                    <p className="text-[10px] text-amber-400 mt-2">Nội dung CK: DATPHONG {selectedRoom.toUpperCase()}</p>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold transition">Xác Nhận Đã Thanh Toán</button>
                </form>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HomestayApp />);
  </script>
</body>
</html>
